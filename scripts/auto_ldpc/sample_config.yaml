system:
  command_prefix: []

paths:
  workspace_root: "."
  output_root: "/share/users/wenlin_zhao/Desktop/01-Gecko_Matrix/test_py1"
  exec: "LDPC_Sim_Gen4_dq/ssd_fc"
  config: "/share/users/wenlin_zhao/My_Project/LDPCAutoTest/LDPC_Sim_Gen4_dq/config/sdec_dq.cnfg"
  gen_bin: "GenLDPC/ldpc_gen"
  matrix_dir: "${OUTPUT_ROOT}/gen_matrix"
  sim_out_root: "${OUTPUT_ROOT}/run_log"
  perf_dir: "${OUTPUT_ROOT}/perf"
  log_suffix: ".log"

generation:
  gen_n: 149
  gen_k: 129
  gen_count: 2
  batch_size: 2
  queue: "regr_q"
  mode: "lsf"
  gen_out_base: "${OUTPUT_ROOT}/gen_matrix"

simulation:
  queue: "regr_q"
  job_prefix: "ldpc_auto"
  snr_list: [3.6, 3.7]
  anchor_snr: 3.7
  deep_snr_list: [3.71]
  dry_run: false

selection:
  top_n: 10
  err_inj_threshold: 0.001

err_inj:
  config: "/share/users/wenlin_zhao/My_Project/LDPCAutoTest/LDPC_Sim_Gen4_dq/config/another.cnfg"
  command: "./ssd_fc LDPC {config} ERR_INJ 340 {matrix_id}"
  queue: "regr_q"
  job_prefix: "ldpc_errinj"

limits:
  max_matrices: 10
  max_runtime_hours: null
  sleep_seconds: 10
  stop_flag_file: "${OUTPUT_ROOT}/STOP"

log_parser:
  awgn:
    stat_keys:
      - "Total simulated number"
      - "RAW  BER"
      - "LDPC BER"
      - "LDPC FER"
      - "MCRC FER"
      - "DATA FER"
      - "Retry Decoder average iterations"
    fer_key: "LDPC FER"
    statistics_prefix: "[STATISTICS]"
  err_inj:
    stat_keys:
      - "Total simulated number"
      - "RAW  BER"
      - "LDPC BER"
      - "LDPC FER"
      - "MCRC FER"
      - "DATA FER"
      - "Fast Decoder average iterations"
    fer_key: "LDPC FER"
    statistics_prefix: "[STATISTICS]"

xlsx:
  enable: true
  filename: "auto_ldpc_results.xlsx"

database:
  path: "state/state.db"

plot:
  enable: true
  output: "${OUTPUT_ROOT}/perf/best_plot.png"
  baseline:
    path: null
    sheet: "baseline"
    snr_column: "SNR"
    fer_column: "FER"
